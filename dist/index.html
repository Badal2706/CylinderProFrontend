<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GURU Industries — CylinderPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:        #2563eb;
      --primary-dark:   #1d4ed8;
      --primary-light:  #eff6ff;
      --success:        #16a34a;
      --success-light:  #dcfce7;
      --warning:        #d97706;
      --warning-light:  #fef9c3;
      --danger:         #dc2626;
      --danger-light:   #fee2e2;
      --sidebar-w:      14.375rem;  /* 230px @ 16px root — rem so chrome scales with text/zoom */
      --sidebar-w-mini: 3.75rem;    /* 60px — collapsed icon rail */
      --sidebar-bg:     #0f172a;
      --sidebar-text:   #94a3b8;
      --sidebar-hover:  rgba(255,255,255,.06);
      --sidebar-active: #2563eb;
      --bg:             #f8fafc;
      --surface:        #ffffff;
      --border:         #e2e8f0;
      --text:           #0f172a;
      --text-2:         #475569;
      --text-muted:     #94a3b8;
      --radius:         12px;
      --radius-sm:      8px;
      --shadow:         0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
      --shadow-sm:      0 1px 2px rgba(0,0,0,.05);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── APP SHELL ─── */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 200;
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .sidebar-brand-icon {
      width: 36px; height: 36px;
      background: var(--primary);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      margin-bottom: 0.625rem;
    }

    .sidebar-brand-name {
      font-size: 0.9375rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .sidebar-brand-sub {
      font-size: 0.7rem;
      color: var(--sidebar-text);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .sidebar-section {
      padding: 1rem 0.75rem 0.25rem;
    }

    .sidebar-section-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sidebar-text);
      padding: 0 0.5rem;
      margin-bottom: 0.25rem;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      width: 100%;
      padding: 0.5625rem 0.75rem;
      background: transparent;
      border: none;
      color: var(--sidebar-text);
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 500;
      font-family: inherit;
      transition: background 0.14s, color 0.14s;
      text-align: left;
      white-space: nowrap;
      margin-bottom: 2px;
    }

    .nav-link .nav-icon {
      font-size: 1rem;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .nav-link:hover  { background: var(--sidebar-hover); color: #e2e8f0; }
    .nav-link.active {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    /* ─── MAIN CONTENT ─── */
    .main-content {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-width: 0;          /* allow flex child to shrink so wide tables scroll instead of overflowing */
      max-width: 100%;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.75rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-title {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--text);
    }

    .topbar-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .container {
      padding: 1.75rem;
      max-width: 1300px;
    }

    /* ─── CARDS ─── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.25rem;
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1.25rem;
      padding-bottom: 0.875rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card h3 {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.75rem;
    }

    /* ─── STAT CARDS ─── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.375rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .stat-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .stat-card.green .stat-icon  { background: #dcfce7; }
    .stat-card.blue .stat-icon   { background: #dbeafe; }
    .stat-card.orange .stat-icon { background: #fef9c3; }
    .stat-card.purple .stat-icon { background: #ede9fe; }
    .stat-card.red .stat-icon    { background: #fee2e2; }

    .stat-body { flex: 1; min-width: 0; }

    .stat-card h3 {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .stat-card .value {
      font-size: 1.625rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    /* ─── QUICK ACTIONS ─── */
    .quick-actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.875rem;
    }

    .quick-action-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.375rem;
      padding: 1.125rem;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      text-align: left;
    }

    .quick-action-btn:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37,99,235,.12);
    }

    .qa-icon {
      font-size: 1.4rem;
    }

    .qa-title {
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--text);
    }

    .qa-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* ─── FORMS ─── */
    .form-group { margin-bottom: 1.125rem; }

    .form-group label {
      display: block;
      margin-bottom: 0.375rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-2);
    }

    .form-control {
      width: 100%;
      padding: 0.5625rem 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.14s, box-shadow 0.14s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
    }

    /* ─── BUTTONS ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 1.125rem;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.14s;
      white-space: nowrap;
      line-height: 1.4;
    }

    .btn-primary  { background: var(--primary); color: #fff; }
    .btn-primary:hover  { background: var(--primary-dark); box-shadow: 0 2px 8px rgba(37,99,235,.3); }

    .btn-secondary { background: var(--surface); color: var(--text-2); border: 1.5px solid var(--border); }
    .btn-secondary:hover { background: var(--bg); }

    .btn-danger   { background: var(--danger); color: #fff; }
    .btn-danger:hover   { background: #b91c1c; }

    .btn-group {
      display: flex;
      gap: 0.625rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ─── TABLES ─── */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      font-size: 0.85rem;
    }

    thead { position: sticky; top: 0; z-index: 1; }

    th {
      background: #f1f5f9;
      color: var(--text-2);
      font-weight: 600;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.7rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #f1f5f9;
      color: var(--text);
      vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f8fafc; }

    tfoot td {
      background: #f1f5f9;
      font-weight: 700;
      border-top: 2px solid var(--border);
      padding: 0.7rem 1rem;
      color: var(--text);
    }

    .row-over-limit td { background: #fff5f5 !important; }
    .row-credit td    { background: #f0fdf4 !important; }

    .clickable {
      cursor: pointer;
      color: var(--primary);
      font-weight: 600;
    }
    .clickable:hover { text-decoration: underline; }

    /* ─── BADGES ─── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.625rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge-danger  { background: var(--danger-light);  color: #b91c1c; }
    .badge-success { background: var(--success-light); color: #15803d; }
    .badge-warning { background: var(--warning-light); color: #b45309; }

    /* ─── ALERTS ─── */
    .alert {
      padding: 0.8rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .alert-warning { background: var(--warning-light); color: #92400e; border-left: 3px solid var(--warning); }
    .alert-success { background: var(--success-light); color: #14532d; border-left: 3px solid var(--success); }
    .alert-danger  { background: var(--danger-light);  color: #991b1b; border-left: 3px solid var(--danger); }

    /* ─── SEARCH ─── */
    .search-bar { margin-bottom: 1rem; }

    .search-bar input {
      width: 100%;
      max-width: 360px;
      padding: 0.5rem 0.875rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.14s, box-shadow 0.14s;
    }

    .search-bar input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
      background: var(--surface);
    }

    /* ─── CART ITEMS ─── */
    .cart-item {
      border: 1.5px solid var(--border);
      padding: 1.125rem;
      margin-bottom: 0.875rem;
      border-radius: var(--radius-sm);
      background: var(--bg);
    }

    /* ─── SERIAL TAGS ─── */
    .serial-tags { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.5rem; }

    .serial-tag {
      background: var(--primary-light);
      color: var(--primary);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border: 1px solid #bfdbfe;
    }

    .serial-tag button {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0;
      line-height: 1;
      opacity: 0.6;
    }
    .serial-tag button:hover { opacity: 1; }

    /* Personal / manually-entered cylinders (not in inventory) — yellow highlight (item 9) */
    .serial-tag.personal-cyl {
      background: #FEF08A;
      color: #713F12;
      border-color: #EAB308;
    }
    .serial-tag.personal-cyl button { color: #713F12; }

    /* Transaction direction colors (items 7 & 12) */
    .dir-given    { color: #2563EB; font-weight: 700; }
    .dir-received { color: #DC2626; font-weight: 700; }
    .dir-swap     { color: #D97706; font-weight: 700; }

    /* New Transaction section accents (item 5) — color + left border only, no fill */
    .txn-section-given    { border-left: 3px solid #2563EB; padding-left: 0.85rem; }
    .txn-section-given > h3    { color: #2563EB; }
    .txn-section-received { border-left: 3px solid #DC2626; padding-left: 0.85rem; }
    .txn-section-received > h3 { color: #DC2626; }

    /* Sticky search bar (item 13) — page lists and inside modal scroll areas */
    .search-bar.sticky {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface, #fff);
      padding-top: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .modal-search-sticky {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--surface, #fff);
      padding-bottom: 0.5rem;
    }

    /* Personal-cylinder option in the Given dropdown (item 10) */
    .cyl-option-personal {
      background: #FEF9C3;
    }
    .badge-personal {
      background: #FEF08A;
      color: #713F12;
      border: 1px solid #EAB308;
      font-size: 0.68rem;
      padding: 0 0.3rem;
      border-radius: 4px;
      margin-left: 0.3rem;
    }

    /* ─── LOADING ─── */
    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* ─── MODAL ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 1rem;
    }
    .modal-card {
      background: var(--surface);
      border-radius: var(--radius);
      /* Fluid: scales with the viewport under zoom, capped at the design max — never wider than ~92vw */
      width: min(92vw, 440px);
      max-width: 92vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 80px rgba(0,0,0,.3);
      overflow: hidden;
      animation: modalIn .14s ease-out;
    }
    /* Wide variant for "View All" data modals — sizes to the table's natural width so no
       horizontal scroll is needed (Phase 7); the inner .table-container still scrolls as a
       last resort on very narrow screens. */
    .modal-card.modal-lg { width: fit-content; min-width: min(94vw, 900px); max-width: 96vw; }
    /* Wide variant for horizontal/multi-column form modals (Record Payment, Add/Edit Cylinder, etc.) */
    .modal-card.modal-wide { width: min(94vw, 980px); }
    @media (min-width: 820px) { .modal-card.modal-wide { min-width: min(94vw, 780px); } }
    /* Explicit horizontal grid rows used inside wide form modals */
    .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
    .form-row.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .form-row.challan-remarks { grid-template-columns: 1fr 2fr; }
    /* Right-aligned action buttons at the bottom of a modal form */
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.75rem; }
    @media (max-width: 640px) {
      .form-row.cols-2, .form-row.cols-3, .form-row.challan-remarks { grid-template-columns: 1fr; }
      .modal-card.modal-wide { min-width: 0; }
      .modal-actions { flex-direction: column-reverse; }
    }
    @keyframes modalIn { from { opacity:0; transform: translateY(8px) scale(.99);} to { opacity:1; transform:none; } }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      font-weight: 700;
      font-size: 1rem;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }
    .modal-header.danger {
      background: var(--danger-light);
      color: var(--danger);
      border-bottom: 1px solid #fecaca;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: inherit;
      opacity: .7;
      line-height: 1;
    }
    .modal-close:hover { opacity: 1; }
    .modal-body { padding: 1.25rem; overflow-y: auto; min-height: 0; flex: 1 1 auto; }
    /* Scrollable body for data-heavy modals (table scrolls internally, not the page) */
    .modal-body-scroll { padding: 1.25rem; overflow-y: auto; flex: 1 1 auto; }

    /* ─── DANGER BUTTON ─── */
    .btn-danger {
      background: var(--danger);
      color: white;
      border: none;
    }
    .btn-danger:hover { background: #b91c1c; }

    /* ─── SIDEBAR CLEAR BUTTON ─── */
    .sidebar-clear {
      padding: 0.5rem 0.6rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius-sm);
      color: var(--sidebar-text);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all .15s;
      line-height: 1;
    }
    .sidebar-clear:hover {
      background: rgba(220,38,38,.2);
      border-color: rgba(220,38,38,.4);
    }

    /* ─── SECTION DIVIDER ─── */
    .section-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
    }

    /* ─── AUTH PAGE ─── */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    .auth-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .auth-brand h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.25rem;
    }
    .auth-brand p {
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    .auth-tabs {
      display: flex;
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 1.5rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.5rem;
      border: none;
      background: transparent;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .15s;
    }
    .auth-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .auth-form .form-group { margin-bottom: 1rem; }
    .auth-submit {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    .auth-switch {
      text-align: center;
      margin-top: 1.25rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    .link-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: inherit;
      cursor: pointer;
      font-weight: 600;
      padding: 0;
    }
    .link-btn:hover { text-decoration: underline; }

    /* ─── SIDEBAR FOOTER ─── */
    .sidebar-footer {
      padding: 1rem;
      border-top: 1px solid rgba(255,255,255,.08);
      margin-top: auto;
    }
    .sidebar-user {
      margin-bottom: 0.75rem;
    }
    .sidebar-user-name {
      color: #f1f5f9;
